[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seaf-mcp"
version = "0.1.0"
description = "MCP server for the SEAF ArchTool REST API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
seaf-mcp = "seaf_mcp.server:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seaf_mcp = ["data/*"]
